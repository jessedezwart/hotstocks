name: Deploy to VPS

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
        run: npm run build

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Package build artifacts
        run: |
          mkdir -p release/frontend release/backend release/sql
          cp -r frontend/build release/frontend/
          cp -r backend/dist release/backend/
          cp backend/package.json backend/package-lock.json backend/Dockerfile release/backend/
          cp -r backend/sql/* release/sql/
          cp docker-compose.yml release/
          tar -czf hotstocks-${{ github.sha }}.tar.gz release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotstocks-${{ github.sha }}
          path: hotstocks-${{ github.sha }}.tar.gz

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy frontend to VPS
        run: |
          rsync -avz --delete ./frontend/build/ root@${{ vars.VPS_HOST }}:/var/www/hotstocks/

      - name: Deploy backend to VPS
        run: |
          rsync -avz --exclude 'node_modules' --exclude 'dist' --exclude '.git' ./backend/ root@${{ vars.VPS_HOST }}:/root/hotstocks-backend/

      - name: Deploy docker-compose
        run: |
          rsync -avz ./docker-compose.yml root@${{ vars.VPS_HOST }}:/root/

      - name: Rebuild and restart services
        run: |
          ssh root@${{ vars.VPS_HOST }} "cd /root && docker compose up -d --build"

      - name: Run database migrations
        run: |
          ssh root@${{ vars.VPS_HOST }} "cd /root && docker compose exec -T backend node dist/migrations/migrate.js"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
        run: npm run build

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Package release artifact
        run: |
          mkdir -p release/frontend release/backend release/sql
          cp -r frontend/build release/frontend/
          cp -r backend/dist release/backend/
          cp backend/package.json backend/package-lock.json backend/Dockerfile release/backend/
          cp -r backend/sql/* release/sql/
          cp docker-compose.yml release/
          tar -czf hotstocks-${{ github.ref_name }}.tar.gz release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: hotstocks-${{ github.ref_name }}.tar.gz

name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hotstocks-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/hotstocks-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hotstocks-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/hotstocks-frontend:latest
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_AUTH0_DOMAIN=${{ vars.VITE_AUTH0_DOMAIN }}
            VITE_AUTH0_CLIENT_ID=${{ vars.VITE_AUTH0_CLIENT_ID }}
            VITE_AUTH0_AUDIENCE=${{ vars.VITE_AUTH0_AUDIENCE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy SQL assets
        run: |
          rsync -avz --delete ./backend/sql/ root@${{ vars.VPS_HOST }}:/root/sql/

      - name: Deploy docker-compose
        run: |
          rsync -avz ./docker-compose.yml root@${{ vars.VPS_HOST }}:/root/

      - name: Deploy Caddyfile
        run: |
          rsync -avz ./Caddyfile root@${{ vars.VPS_HOST }}:/etc/caddy/Caddyfile

      - name: Set image tag on VPS
        run: |
          ssh root@${{ vars.VPS_HOST }} "touch /root/.env && (grep -v '^IMAGE_TAG=' /root/.env > /root/.env.tmp || true) && printf '%s\\n' 'IMAGE_TAG=${{ github.sha }}' >> /root/.env.tmp && mv /root/.env.tmp /root/.env"

      - name: Log in to GHCR on VPS
        if: ${{ secrets.GHCR_TOKEN != '' }}
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          ssh root@${{ vars.VPS_HOST }} "echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USERNAME}' --password-stdin"

      - name: Rebuild and restart services
        run: |
          ssh root@${{ vars.VPS_HOST }} "cd /root && docker compose pull && docker compose up -d"

      - name: Reload Caddy
        run: |
          ssh root@${{ vars.VPS_HOST }} "caddy reload --config /etc/caddy/Caddyfile"

      - name: Run database migrations
        run: |
          ssh root@${{ vars.VPS_HOST }} "cd /root && docker compose exec -T backend node dist/migrations/migrate.js"

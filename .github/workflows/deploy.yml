name: Deploy to VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: ./frontend
        env:
          TEST_BASE_URL: https://hotones.nl
          TEST_API_URL: https://api.hotones.nl
        run: npx playwright test --project=chromium

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy frontend to VPS
        run: |
          rsync -avz --delete ./frontend/build/ root@${{ vars.VPS_HOST }}:/var/www/hotstocks/

      - name: Deploy backend to VPS
        run: |
          rsync -avz --exclude 'node_modules' --exclude 'dist' --exclude '.git' ./backend/ root@${{ vars.VPS_HOST }}:/root/hotstocks-backend/

      - name: Deploy docker-compose
        run: |
          rsync -avz ./docker-compose.yml root@${{ vars.VPS_HOST }}:/root/

      - name: Rebuild and restart services
        run: |
          ssh root@${{ vars.VPS_HOST }} "cd /root && docker compose up -d --build"

      - name: Run database migrations
        run: |
          ssh root@${{ vars.VPS_HOST }} "cd /root && docker compose exec -T backend node dist/migrations/migrate.js"

      - name: Run post-deploy tests
        working-directory: ./frontend
        env:
          TEST_BASE_URL: https://hotones.nl
          TEST_API_URL: https://api.hotones.nl
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium tests/api.spec.ts tests/landing.spec.ts
